name: One-PR Claude shadow pilot (disabled)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Approved same-repository PR number, advisory only
        required: true
        type: string
      base_sha:
        description: Exact approved main base SHA (40 lowercase hex characters)
        required: true
        type: string
      head_sha:
        description: Exact approved PR head SHA (40 lowercase hex characters)
        required: true
        type: string

permissions: {}

jobs:
  fetch:
    if: ${{ false && github.repository_id == '1315590853' && github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch bounded PR data
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SHADOW_BASE_SHA: ${{ inputs.base_sha }}
          SHADOW_HEAD_SHA: ${{ inputs.head_sha }}
          SHADOW_FETCH_DEST: ${{ runner.temp }}/fetch-input
        run: bash tools/fetch_shadow_pr.sh
      - name: Seal original fetch bundle
        id: bundle
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: >-
          python -m tools.shadow_jobs fetch --bundle "$RUNNER_TEMP/fetch-input"
          --prompt-source outputs/S2_CR_01_Claude_Review_Prompt_DRAFT.md
      - name: Upload original data-only bundle
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shadow-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fetch-input/
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  provider:
    if: ${{ false && github.repository_id == '1315590853' && github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment: claude-shadow-review
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Require one fetch artifact ID
        env:
          FETCH_ARTIFACT_ID: ${{ needs.fetch.outputs.artifact_id }}
        run: '[[ "$FETCH_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1'
      - name: Download only original fetch artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.fetch.outputs.artifact_id }}
          path: ${{ runner.temp }}/fetch-input
          merge-multiple: true
      - name: Verify original fetch bytes and disabled provider policy
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          FETCH_MANIFEST_SHA256: ${{ needs.fetch.outputs.manifest_sha256 }}
        run: |
          python -m tools.shadow_jobs verify --bundle "$RUNNER_TEMP/fetch-input"
          python -c "from tools.shadow_native_tls import native_policy; native_policy('.github/shadow-provider-policy.json')"
      - name: Install verified CLI and pinned container image before credentials
        id: binary
        run: |
          binary=$(python -m tools.install_claude_shadow)
          printf 'path=%s\n' "$binary" >> "$GITHUB_OUTPUT"
          docker pull python@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39
          mkdir -- "$RUNNER_TEMP/provider-output"
      - name: Run mandatory native TLS reviewer
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          FETCH_MANIFEST_SHA256: ${{ needs.fetch.outputs.manifest_sha256 }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SHADOW_BINARY: ${{ steps.binary.outputs.path }}
        run: >-
          python -m tools.shadow_jobs native-review --bundle "$RUNNER_TEMP/fetch-input"
          --binary "$SHADOW_BINARY" --policy .github/shadow-provider-policy.json
          --destination "$RUNNER_TEMP/provider-output/result.json"
      - name: Upload untrusted provider result only
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shadow-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-output/result.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  validate:
    if: ${{ false && github.repository_id == '1315590853' && github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
    needs: [fetch, provider]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-locked validators
        run: >-
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all:
          --platform manylinux2014_x86_64 --python-version 3.11 --implementation cp
          --abi cp311 --target architecture/schemas/.vendor
          -r architecture/schemas/requirements-shadow-runtime.lock
      - name: Require explicit single artifact IDs
        env:
          FETCH_ARTIFACT_ID: ${{ needs.fetch.outputs.artifact_id }}
          RESULT_ARTIFACT_ID: ${{ needs.provider.outputs.artifact_id }}
        run: |
          [[ "$FETCH_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$RESULT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
      - name: Download fetch artifact from trusted fetch output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.fetch.outputs.artifact_id }}
          path: ${{ runner.temp }}/fetch-input
          merge-multiple: true
      - name: Download bounded provider ZIP without extraction
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_ARTIFACT_ID: ${{ needs.provider.outputs.artifact_id }}
        run: >-
          python -m tools.shadow_result_download
          --destination-dir "$RUNNER_TEMP/provider-output"
      - name: Independently re-fetch current PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SHADOW_BASE_SHA: ${{ inputs.base_sha }}
          SHADOW_HEAD_SHA: ${{ inputs.head_sha }}
          SHADOW_FETCH_DEST: ${{ runner.temp }}/refetched
        run: bash tools/fetch_shadow_pr.sh
      - name: Validate original binding freshness and result
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          FETCH_MANIFEST_SHA256: ${{ needs.fetch.outputs.manifest_sha256 }}
        run: >-
          python -m tools.shadow_jobs validate --bundle "$RUNNER_TEMP/fetch-input"
          --response-dir "$RUNNER_TEMP/provider-output" --refetched-dir "$RUNNER_TEMP/refetched"
          --destination "$RUNNER_TEMP/isolated-shadow-result.json"
      - name: Retain advisory result only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shadow-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/isolated-shadow-result.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
