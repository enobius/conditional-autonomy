name: stage1-exit-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-exit-gate:
    name: stage1-exit-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out clean repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: architecture/schemas/requirements-schema.txt

      - name: Install pinned schema validators
        run: >-
          python -m pip install
          --target architecture/schemas/.vendor
          -r architecture/schemas/requirements-schema.txt

      - name: Run Stage 1 keystone and seeded-defect campaign
        run: >-
          python -m runtime.conditional_autonomy.stage1_exit
          --verify-seeded-defects
