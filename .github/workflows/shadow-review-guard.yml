name: shadow-review-guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-review-guard:
    name: shadow-review-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test validators
        run: >-
          python -m pip install --target architecture/schemas/.vendor
          -r architecture/schemas/requirements-schema.txt
          -r architecture/schemas/requirements-test.txt
      - name: Verify locked shadow runtime wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --platform manylinux2014_x86_64 --python-version 3.11
          --implementation cp --abi cp311 --target "$RUNNER_TEMP/shadow-lock"
          -r architecture/schemas/requirements-shadow-runtime.lock
      - name: Run shadow guard tests
        run: >-
          python -m unittest tests.test_claude_shadow_workflow tests.test_fetch_shadow_pr
          tests.test_review_verdict tests.test_review_shadow tests.test_install_claude_shadow
          tests.test_run_claude_shadow
          tests.test_shadow_tool_evidence
          tests.test_shadow_artifact_binding
          tests.test_shadow_container
          tests.test_shadow_egress_proxy
          tests.test_shadow_isolated_workflow tests.test_shadow_jobs tests.test_shadow_network_run
          tests.test_shadow_result_download tests.test_shadow_native_tls tests.test_shadow_pilot_permit
