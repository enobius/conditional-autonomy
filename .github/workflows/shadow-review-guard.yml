name: shadow-review-guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-review-guard:
    name: shadow-review-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test validators
        run: >-
          python -m pip install --target architecture/schemas/.vendor
          -r architecture/schemas/requirements-schema.txt
          -r architecture/schemas/requirements-test.txt
      - name: Verify locked shadow runtime wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --platform manylinux2014_x86_64 --python-version 3.11
          --implementation cp --abi cp311 --target "$RUNNER_TEMP/shadow-lock"
          -r architecture/schemas/requirements-shadow-runtime.lock
      - name: Run shadow guard tests
        run: >-
          python -m unittest tests.test_claude_shadow_workflow
          tests.test_review_verdict tests.test_review_shadow
