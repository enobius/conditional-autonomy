name: shadow-hosted-dummy

on:
  pull_request:
    paths:
      - '.github/workflows/shadow-hosted-dummy.yml'
      - '.github/workflows/claude-review-isolated.yml'
      - '.github/shadow-provider-policy.json'
      - 'tests/**'
      - 'tools/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/shadow-hosted-dummy.yml'
      - '.github/workflows/claude-review-isolated.yml'
      - '.github/shadow-provider-policy.json'
      - 'tests/**'
      - 'tools/**'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pull pinned credential-free probe image
        run: docker pull python@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39
      - name: Probe production topology with temporary dummy credential
        run: python -m tests.shadow_hosted_dummy probe --directory "$RUNNER_TEMP/dummy-result"
      - name: Probe isolated routes and synthetic proxy
        run: python -m tests.shadow_proxy_network_probe
      - name: Upload synthetic result only
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dummy-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dummy-result/result.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  artifact-check:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify real artifact layout and wrong-run rejection
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_ARTIFACT_ID: ${{ needs.probe.outputs.artifact_id }}
        run: python -m tests.shadow_hosted_dummy artifact
