name: Claude review shadow (manual only)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to review (shadow mode only)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  shadow-review:
    # Never run PR-controlled workflow versions with the owner's credential.
    # Hard stop pending independent review and CLI/live compatibility checks.
    # Removing this guard is a separate reviewed change.
    if: ${{ false }}
    # The owner must configure this environment with main-only deployment
    # protection before adding an environment-scoped credential. Naming an
    # environment here does not configure or prove those protections.
    environment: claude-shadow-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned validators
        run: python -m pip install --target architecture/schemas/.vendor -r architecture/schemas/requirements-schema.txt
      - name: Fetch selected open PR as untrusted data
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,baseRefOid,headRefOid,state > "$RUNNER_TEMP/pr-before.json"
          jq -e '.baseRefName == "main" and .state == "OPEN" and (.baseRefOid | test("^[0-9a-f]{40}$")) and (.headRefOid | test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/pr-before.json" > /dev/null
          base=$(jq -r .baseRefOid "$RUNNER_TEMP/pr-before.json")
          head=$(jq -r .headRefOid "$RUNNER_TEMP/pr-before.json")
          compare="repos/$GITHUB_REPOSITORY/compare/$base...$head"
          gh api "$compare" > "$RUNNER_TEMP/compare.json"
          # GitHub caps the compare file list. Missing patches can represent
          # binary or truncated content, so do not produce an approval for it.
          jq -e '(.files | type == "array" and length > 0 and length < 300 and all(.[]; (.patch | type == "string")))' "$RUNNER_TEMP/compare.json" > /dev/null
          merge_base=$(jq -r '.merge_base_commit.sha' "$RUNNER_TEMP/compare.json")
          [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api -H 'Accept: application/vnd.github.v3.diff' "$compare" > "$RUNNER_TEMP/pr.diff"
          jq --arg sha "$merge_base" '. + {mergeBaseOid: $sha}' "$RUNNER_TEMP/pr-before.json" > "$RUNNER_TEMP/pr-before-bound.json"
      - name: Prepare bounded review prompt
        id: prepared
        run: >-
          python -m tools.claude_shadow_workflow prepare
          --before "$RUNNER_TEMP/pr-before-bound.json"
          --diff "$RUNNER_TEMP/pr.diff"
          --prompt outputs/S2_CR_01_Claude_Review_Prompt_DRAFT.md
          --destination "$GITHUB_OUTPUT"
      - name: Review untrusted diff in shadow mode
        id: review
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1 commit
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prepared.outputs.prompt }}
          claude_args: >-
            --model claude-opus-5-5 --max-turns 1 --tools=
            --disallowedTools "mcp__*"
            --json-schema '{"type":"object","additionalProperties":false,"required":["outcome","findings","uncertainties","confidence","rationale"],"properties":{"outcome":{"enum":["approve","revision-required","escalate-to-human"]},"findings":{"type":"array","items":{"type":"object"}},"uncertainties":{"type":"array","items":{"type":"string"}},"confidence":{"type":"number"},"rationale":{"type":"string"}}}'
      - name: Recheck PR snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,baseRefOid,headRefOid,state > "$RUNNER_TEMP/pr-after.json"
          jq --arg sha "$(jq -r .mergeBaseOid "$RUNNER_TEMP/pr-before-bound.json")" '. + {mergeBaseOid: $sha}' "$RUNNER_TEMP/pr-after.json" > "$RUNNER_TEMP/pr-after-bound.json"
      - name: Validate structured shadow result
        env:
          CLAUDE_SHADOW_RESULT: ${{ steps.review.outputs.structured_output }}
          SHADOW_PR_NUMBER: ${{ inputs.pr_number }}
        run: >-
          python -m tools.claude_shadow_workflow validate
          --before "$RUNNER_TEMP/pr-before-bound.json"
          --after "$RUNNER_TEMP/pr-after-bound.json"
          --diff "$RUNNER_TEMP/pr.diff"
          --destination "$RUNNER_TEMP/claude-shadow-result.json"
      - name: Retain unverified shadow result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-shadow-result
          path: ${{ runner.temp }}/claude-shadow-result.json
          retention-days: 1
          if-no-files-found: error
