name: runtime-invariant-gate

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-invariant-gate.yml"
      - "architecture/schemas/v1.0/deferred-invariants.md"
      - "runtime/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/runtime-invariant-gate.yml"
      - "architecture/schemas/v1.0/deferred-invariants.md"
      - "runtime/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-invariant-gate:
    name: runtime-invariant-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run runtime unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate invariant corpus/register consistency
        run: python tests/fixtures/invariants/check_corpus.py

      - name: Compute invariant-register status from named test evidence
        run: python -m runtime.conditional_autonomy.invariant_register
