name: runtime-invariant-gate

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-invariant-gate.yml"
      - "architecture/retired/claude-review-shadow.yml"
      - ".github/workflows/claude-review-isolated.yml"
      - ".github/shadow-provider-policy.json"
      - "architecture/schemas/**"
      - "architecture/schemas/v1.0/deferred-invariants.md"
      - "runtime/**"
      - "tests/**"
      - "tools/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/runtime-invariant-gate.yml"
      - "architecture/retired/claude-review-shadow.yml"
      - ".github/workflows/claude-review-isolated.yml"
      - ".github/shadow-provider-policy.json"
      - "architecture/schemas/**"
      - "architecture/schemas/v1.0/deferred-invariants.md"
      - "runtime/**"
      - "tests/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-invariant-gate:
    name: runtime-invariant-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Development authority checks raw blobs in the approved historical commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned schema validators
        run: >-
          python -m pip install --no-cache-dir
          --target architecture/schemas/.vendor
          -r architecture/schemas/requirements-schema.txt
          -r architecture/schemas/requirements-test.txt

      - name: Run runtime unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate invariant corpus/register consistency
        run: python tests/fixtures/invariants/check_corpus.py

      - name: Compute invariant-register status from named test evidence
        run: python -m runtime.conditional_autonomy.invariant_register
